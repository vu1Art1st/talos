services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vulnplatform}
      # 全容器统一系统时区：UTC+8 北京时间
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnplatform}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["gotenberg", "--api-timeout=120s"]

  api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    environment: &backend_env
      TZ: Asia/Shanghai
      VP_TIMEZONE: ${VP_TIMEZONE:-Asia/Shanghai}
      VP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vulnplatform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vulnplatform}
      VP_REDIS_URL: redis://redis:6379/0
      VP_GOTENBERG_URL: http://gotenberg:3000
      VP_SECRET_KEY: ${VP_SECRET_KEY:?set VP_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      VP_STORAGE_DIR: /app/storage
      # 渠道通知邮件（F3）：VP_SMTP_HOST 留空则邮件通道禁用（webhook 通知不受影响）
      VP_SMTP_HOST: ${VP_SMTP_HOST:-}
      VP_SMTP_PORT: ${VP_SMTP_PORT:-25}
      VP_SMTP_USER: ${VP_SMTP_USER:-}
      VP_SMTP_PASS: ${VP_SMTP_PASS:-}
      VP_SMTP_FROM: ${VP_SMTP_FROM:-}
      # 安全整改（批次 E）：可信反向代理层数（默认 1＝浏览器 → 前端 Nginx → API）；
      # 外层还有宿主 Nginx/CDN 时调大，且每一层都必须用 $proxy_add_x_forwarded_for 追加真实对端
      VP_TRUSTED_PROXY_HOPS: ${VP_TRUSTED_PROXY_HOPS:-1}
      # HTTPS 部署时设为 true（图片 Cookie 加 Secure）；HTTP 下开启会被浏览器拒收导致图片不显示
      VP_COOKIE_SECURE: ${VP_COOKIE_SECURE:-false}
      # 压缩包（docx/xlsx）解压配额：条目数 / 解压总量(MB) / 压缩比，防 zip 炸弹
      VP_ARCHIVE_MAX_ENTRIES: ${VP_ARCHIVE_MAX_ENTRIES:-2000}
      VP_ARCHIVE_MAX_UNCOMPRESSED_MB: ${VP_ARCHIVE_MAX_UNCOMPRESSED_MB:-200}
      VP_ARCHIVE_MAX_RATIO: ${VP_ARCHIVE_MAX_RATIO:-100}
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    command: ["arq", "app.workers.main.WorkerSettings"]
    environment: *backend_env
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      # 上下文取仓库根：访问令牌页 ?raw 导入 docs/OPEN_API_GUIDE.md（见 frontend/Dockerfile 与根 .dockerignore）
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "27012:8080"

volumes:
  pg_data:
  storage_data:
