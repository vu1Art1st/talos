<!DOCTYPE html>
<!--
  安全态势 UI 优化 Demo (dashboard.html)
  单文件 HTML，CDN 引入 Vue3 + Element Plus + Tailwind + ECharts，零构建双击预览。
  风格与另外两个 demo 完全一致：统一设计令牌、统计卡限宽、4 张 ECharts 图表卡片 header 统一、
  部门概况柱线混合图。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全态势 · Talos UI 优化 Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script src="https://unpkg.com/element-plus/dist/locale/zh-cn.min.js"></script>
  <script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --tl-bg: #f6f7f9; --tl-surface: #ffffff; --tl-surface-2: #f9fafb;
      --tl-border: #e5e7eb; --tl-text-1: #111827; --tl-text-2: #4b5563; --tl-text-3: #9ca3af;
      --tl-primary: #4f46e5; --tl-primary-light-9: #edecfc; --el-color-primary: #4f46e5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: 'Inter','Helvetica Neue',Helvetica,'PingFang SC','Microsoft YaHei',Arial,sans-serif; background: var(--tl-bg); color: var(--tl-text-1); font-size: 14px; }
    .tl-brand-gradient { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .app-shell { display: flex; height: 100vh; overflow: hidden; }
    .tl-aside { width: 220px; flex: none; background: var(--tl-surface); border-right: 1px solid var(--tl-border); display: flex; flex-direction: column; }
    .tl-logo { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--tl-border); }
    .tl-logo-name { font-weight: 700; font-size: 15px; white-space: nowrap; }
    .tl-menu { flex: 1; padding-top: 4px; list-style: none; margin: 0; }
    .tl-menu-item { display: flex; align-items: center; gap: 10px; height: 42px; margin: 3px 10px; padding: 0 12px; border-radius: 8px; color: var(--tl-text-2); cursor: pointer; font-size: 14px; transition: background .2s, color .2s; }
    .tl-menu-item:hover { background: var(--tl-surface-2); color: var(--tl-text-1); }
    .tl-menu-item.active { background: var(--tl-primary-light-9); color: var(--el-color-primary); font-weight: 600; }
    .tl-aside-foot { padding: 12px; border-top: 1px solid var(--tl-border); }
    .tl-header { height: 56px; flex: none; background: var(--tl-surface); border-bottom: 1px solid var(--tl-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .tl-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tl-content { flex: 1; overflow: auto; padding: 16px; }
    .tl-card { background: var(--tl-surface); border: 1px solid var(--tl-border); border-radius: 12px; transition: box-shadow .25s ease, transform .25s ease; }
    .tl-card.hoverable:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08), 0 12px 32px rgba(79,70,229,.10); transform: translateY(-2px); }
    .section-title { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 4px 0 4px; }
    .section-title::before, .section-title::after { content: ''; height: 1px; flex: none; width: 120px; }
    .section-title::before { background: linear-gradient(to right, transparent, #c7c9ff); }
    .section-title::after { background: linear-gradient(to left, transparent, #c7c9ff); }
    .section-title .txt { font-size: 15px; font-weight: 600; color: var(--tl-text-1); white-space: nowrap; }
    .section-sub { text-align: center; font-size: 12px; color: var(--tl-text-3); margin-bottom: 14px; }
    .stat-card { padding: 16px 18px; position: relative; overflow: hidden; }
    .stat-card .label { font-size: 13px; color: var(--tl-text-2); }
    .stat-card .value { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .stat-card .ico { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .stat-card .ico-glow { position: absolute; right: -10px; top: -10px; width: 70px; height: 70px; border-radius: 50%; filter: blur(20px); opacity: .35; }
    .chart-card .chart-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--tl-border); }
    .chart-card .chart-head .t { font-size: 14px; font-weight: 600; }
    .chart-card .chart-head .s { font-size: 12px; color: var(--tl-text-3); }
    .tl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tl-table th { background: var(--tl-surface-2); color: var(--tl-text-2); font-weight: 600; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--tl-border); }
    .tl-table td { padding: 11px 14px; border-bottom: 1px solid var(--tl-border); color: var(--tl-text-1); }
    .tl-table tbody tr:hover { background: var(--tl-primary-light-9); }
    .unify-w-md { width: 160px !important; }
    .tl-content::-webkit-scrollbar { width: 8px; }
    .tl-content::-webkit-scrollbar-thumb { background: #d8dbe0; border-radius: 4px; }
  </style>
</head>
<body>
<div id="app" class="app-shell">
  <aside class="tl-aside">
    <div class="tl-logo">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-none tl-brand-gradient">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <span class="tl-logo-name">Talos 漏洞管理平台</span>
    </div>
    <ul class="tl-menu">
      <li class="tl-menu-item active"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>安全态势</li>
      <li class="tl-menu-item"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v13H3z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>渗透测试工单</li>
      <li class="tl-menu-item"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>漏扫基线工单</li>
      <li class="tl-menu-item"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7v6c0 5 10 9 10 9s10-4 10-9V7z"/><path d="M12 8v4m0 4h.01"/></svg>历史漏洞库</li>
      <li class="tl-menu-item"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/></svg>漏洞模板库</li>
      <li class="tl-menu-item"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>报告中心</li>
    </ul>
    <div class="tl-aside-foot">
      <button class="tl-menu-item" style="border:1px solid var(--tl-border); justify-content:center; width:100%; margin:0;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v18M3 9h18"/></svg>收起菜单
      </button>
    </div>
  </aside>

  <div class="tl-main">
    <header class="tl-header">
      <div class="text-base font-semibold">安全态势</div>
      <div class="flex items-center gap-3">
        <button class="tl-menu-item" style="margin:0; padding:6px; border-radius:8px;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <span class="flex items-center gap-2 cursor-pointer">
          <span class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-white tl-brand-gradient">管</span>
          安全管理员
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </div>
    </header>

    <main class="tl-content">
      <!-- 筛选栏 -->
      <div class="tl-card p-4 mb-4">
        <div class="flex flex-wrap items-center gap-3">
          <input class="unify-w-md h-8 rounded-md border border-[#e5e7eb] text-sm px-3 outline-none bg-white" placeholder="选择日期范围" style="border-radius:8px;" value="2026-01-01 ~ 2026-08-13" />
          <select class="unify-w-md h-8 rounded-md border border-[#e5e7eb] text-sm px-2 outline-none bg-white"><option>全部部门</option><option>信息科技部</option><option>运营管理部</option><option>风控合规部</option></select>
          <select class="unify-w-md h-8 rounded-md border border-[#e5e7eb] text-sm px-2 outline-none bg-white"><option>全部来源</option><option>渗透测试</option><option>漏扫基线</option><option>外部情报</option></select>
          <select class="unify-w-md h-8 rounded-md border border-[#e5e7eb] text-sm px-2 outline-none bg-white"><option>全部等级</option><option>严重</option><option>高危</option><option>中危</option><option>低危</option></select>
          <div class="flex-1"></div>
          <button class="h-8 px-3 rounded-md text-sm" style="color:#4f46e5; background:none; border:none; cursor:pointer;">重置筛选</button>
        </div>
      </div>

      <!-- 统计卡片区（4 张限宽） -->
      <div class="mb-4">
        <div class="section-title"><span class="txt">态势概览</span></div>
        <div class="section-sub">截至 2026-08-13 的安全态势核心指标</div>
        <div class="max-w-7xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="tl-card hoverable stat-card">
            <div class="ico-glow" style="background:#4F46E5"></div>
            <div class="ico tl-brand-gradient"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2L2 7v6c0 5 10 9 10 9s10-4 10-9V7z"/></svg></div>
            <div class="label">存量漏洞</div>
            <div class="value" style="color:#4F46E5">1,286</div>
            <svg class="mt-2 w-full h-8" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="0,24 12,20 24,22 36,15 48,18 60,10 72,13 84,7 100,5" fill="none" stroke="#4F46E5" stroke-width="2"/></svg>
          </div>
          <div class="tl-card hoverable stat-card">
            <div class="ico-glow" style="background:#F56C6C"></div>
            <div class="ico" style="background:#F56C6C1f"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#F56C6C" stroke-width="2"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
            <div class="label">高危及以上</div>
            <div class="value" style="color:#F56C6C">250</div>
            <svg class="mt-2 w-full h-8" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="0,8 12,12 24,10 36,16 48,14 60,20 72,18 84,24 100,22" fill="none" stroke="#F56C6C" stroke-width="2"/></svg>
          </div>
          <div class="tl-card hoverable stat-card">
            <div class="ico-glow" style="background:#67C23A"></div>
            <div class="ico" style="background:#67C23A1f"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#67C23A" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
            <div class="label">已修复</div>
            <div class="value" style="color:#67C23A">942</div>
            <svg class="mt-2 w-full h-8" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="0,22 12,18 24,20 36,14 48,16 60,9 72,11 84,6 100,4" fill="none" stroke="#67C23A" stroke-width="2"/></svg>
          </div>
          <div class="tl-card hoverable stat-card">
            <div class="ico-glow" style="background:#E6A23C"></div>
            <div class="ico" style="background:#E6A23C1f"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#E6A23C" stroke-width="2"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg></div>
            <div class="label">修复率</div>
            <div class="value" style="color:#E6A23C">73.2%</div>
            <svg class="mt-2 w-full h-8" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="0,20 12,18 24,16 36,13 48,14 60,10 72,9 84,7 100,5" fill="none" stroke="#E6A23C" stroke-width="2"/></svg>
          </div>
        </div>
      </div>

      <!-- 图表区 2x2 -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 max-w-7xl mx-auto mb-4">
        <div class="tl-card chart-card hoverable">
          <div class="chart-head"><span class="t">漏洞趋势</span><span class="s">近 12 个月</span></div>
          <div ref="trend" style="height:280px"></div>
        </div>
        <div class="tl-card chart-card hoverable">
          <div class="chart-head"><span class="t">等级分布</span><span class="s">占比</span></div>
          <div ref="level" style="height:280px"></div>
        </div>
        <div class="tl-card chart-card hoverable">
          <div class="chart-head"><span class="t">修复状态分布</span><span class="s">占比</span></div>
          <div ref="status" style="height:280px"></div>
        </div>
        <div class="tl-card chart-card hoverable">
          <div class="chart-head"><span class="t">漏洞类型 Top10</span><span class="s">数量</span></div>
          <div ref="top10" style="height:280px"></div>
        </div>
      </div>

      <!-- 部门安全概况 -->
      <div class="tl-card p-4 max-w-7xl mx-auto">
        <div class="chart-head" style="border:none; padding:0 0 12px"><span class="t">部门安全概况</span><span class="s">漏洞数 vs 修复率</span></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div ref="deptChart" style="height:300px"></div>
          <div>
            <table class="tl-table">
              <thead><tr><th>部门</th><th>漏洞数</th><th>已修复</th><th>修复率</th></tr></thead>
              <tbody>
                <tr v-for="d in depts" :key="d.name">
                  <td>{{ d.name }}</td><td>{{ d.total }}</td><td>{{ d.fixed }}</td><td>{{ d.rate }}%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  const { createApp, ref, onMounted, nextTick } = Vue
  createApp({
    setup() {
      const trend = ref(null), level = ref(null), status = ref(null), top10 = ref(null), deptChart = ref(null)
      const depts = [
        { name: '信息科技部', total: 542, fixed: 410, rate: 75.6 },
        { name: '运营管理部', total: 388, fixed: 286, rate: 73.7 },
        { name: '风控合规部', total: 356, fixed: 246, rate: 69.1 },
      ]
      onMounted(() => {
        nextTick(() => {
          const charts = []
          const baseGrid = { left: 48, right: 20, top: 30, bottom: 30 }
          // 趋势面积图
          const c1 = echarts.init(trend.value)
          c1.setOption({
            tooltip: { trigger: 'axis' },
            grid: baseGrid,
            xAxis: { type: 'category', data: ['9月','10月','11月','12月','1月','2月','3月','4月','5月','6月','7月','8月'], axisLine:{lineStyle:{color:'#e5e7eb'}}, axisLabel:{color:'#9ca3af'} },
            yAxis: { type: 'value', splitLine:{lineStyle:{color:'#f0f1f3'}}, axisLabel:{color:'#9ca3af'} },
            series: [{ type:'line', smooth:true, data:[86,72,95,110,124,98,132,140,118,150,138,126],
              areaStyle:{ color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(79,70,229,.35)'},{offset:1,color:'rgba(79,70,229,0)'}]) },
              lineStyle:{ color:'#4F46E5', width:2 }, itemStyle:{ color:'#4F46E5' }, showSymbol:false }],
          })
          charts.push(c1)
          // 等级环形
          const c2 = echarts.init(level.value)
          c2.setOption({
            tooltip: { trigger: 'item' },
            legend: { bottom: 0, textStyle:{color:'#4b5563', fontSize:11} },
            series: [{ type:'pie', radius:['45%','70%'], center:['50%','45%'],
              data:[{name:'严重',value:36,itemStyle:{color:'#A61B29'}},{name:'高危',value:214,itemStyle:{color:'#F56C6C'}},{name:'中危',value:568,itemStyle:{color:'#E6A23C'}},{name:'低危',value:468,itemStyle:{color:'#409EFF'}}],
              label:{ show:false } }],
          })
          charts.push(c2)
          // 状态环形
          const c3 = echarts.init(status.value)
          c3.setOption({
            tooltip: { trigger: 'item' },
            legend: { bottom: 0, textStyle:{color:'#4b5563', fontSize:11} },
            series: [{ type:'pie', radius:['45%','70%'], center:['50%','45%'],
              data:[{name:'未修复',value:344,itemStyle:{color:'#F56C6C'}},{name:'修复中',value:210,itemStyle:{color:'#E6A23C'}},{name:'已修复',value:942,itemStyle:{color:'#67C23A'}}],
              label:{ show:false } }],
          })
          charts.push(c3)
          // Top10 横向柱
          const c4 = echarts.init(top10.value)
          const tdata = [['SQL注入',186],['跨站脚本',164],['命令执行',142],['反序列化',120],['弱口令',108],['信息泄露',96],['未授权访问',88],['配置缺陷',76],['逻辑缺陷',64],['加密缺陷',52]]
          c4.setOption({
            tooltip: { trigger: 'axis', axisPointer:{type:'shadow'} },
            grid: { left: 90, right: 24, top: 10, bottom: 20 },
            xAxis: { type:'value', splitLine:{lineStyle:{color:'#f0f1f3'}}, axisLabel:{color:'#9ca3af'} },
            yAxis: { type:'category', data: tdata.map(d=>d[0]).reverse(), axisLabel:{color:'#4b5563'}, axisLine:{lineStyle:{color:'#e5e7eb'}} },
            series: [{ type:'bar', data: tdata.map(d=>d[1]).reverse(), barWidth: 12,
              itemStyle:{ color: new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#6366f1'},{offset:1,color:'#8b5cf6'}]), borderRadius:[0,6,6,0] } }],
          })
          charts.push(c4)
          // 部门柱线混合
          const c5 = echarts.init(deptChart.value)
          c5.setOption({
            tooltip: { trigger: 'axis' },
            legend: { bottom: 0, textStyle:{color:'#4b5563', fontSize:11} },
            grid: { left: 48, right: 48, top: 30, bottom: 36 },
            xAxis: { type:'category', data: depts.map(d=>d.name), axisLabel:{color:'#4b5563'}, axisLine:{lineStyle:{color:'#e5e7eb'}} },
            yAxis: [
              { type:'value', name:'漏洞数', splitLine:{lineStyle:{color:'#f0f1f3'}}, axisLabel:{color:'#9ca3af'} },
              { type:'value', name:'修复率%', max:100, axisLabel:{color:'#9ca3af'}, splitLine:{show:false} },
            ],
            series: [
              { name:'漏洞数', type:'bar', data: depts.map(d=>d.total), barWidth: 28, itemStyle:{ color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#6366f1'},{offset:1,color:'#8b5cf6'}]), borderRadius:[6,6,0,0] } },
              { name:'修复率', type:'line', yAxisIndex:1, data: depts.map(d=>d.rate), smooth:true, symbol:'circle', symbolSize:8, lineStyle:{color:'#67C23A', width:2}, itemStyle:{color:'#67C23A'} },
            ],
          })
          charts.push(c5)
          window.addEventListener('resize', () => charts.forEach(c => c.resize()))
        })
      })
      return { trend, level, status, top10, deptChart, depts }
    },
  }).use(ElementPlus).mount('#app')
</script>
</body>
</html>
