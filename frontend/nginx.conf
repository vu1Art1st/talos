server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    # 隐藏版本号（减少指纹信息）
    server_tokens off;

    # ---------- 安全响应头（安全审计 批次 E-2） ----------
    # 防点击劫持：本系统不应被任何站点 iframe 嵌套
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP 先以「仅报告」模式观察（不阻断，违规只在浏览器控制台报出）：
    # 前端使用 Element Plus（运行时注入内联样式）与 data:/blob: 图片，直接强制可能误伤版式。
    # 观察 1~2 周无违规后，把下面的 Content-Security-Policy-Report-Only 改名去掉 -Report-Only 即生效。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # HSTS：确认全站 HTTPS（含证书链完整、无混合内容）后再取消注释；一旦下发浏览器会长期缓存，难以回退
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 使用 Docker 内置 DNS 动态解析上游服务名：nginx 配置中直接写服务名只会在启动时
    # 解析一次并缓存 IP，api 容器重建后 IP 变化会导致 502。用变量 + resolver 实现运行时解析。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # 透传真实客户端信息：后端据此解析审计日志来源 IP / 协议。
        # $proxy_add_x_forwarded_for 会把本层看到的真实对端 $remote_addr 追加到链尾；
        # 后端按「右起第 VP_TRUSTED_PROXY_HOPS 项」取客户端 IP（默认 1＝本层），
        # 外层若还有代理，除了同样追加头之外，还需把 VP_TRUSTED_PROXY_HOPS 相应调大。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 图片目录：仍需登录（安全审计 批次 E-1：不再是静态直出，改由 API 鉴权后下发）。
    # 浏览器靠 vp_img Cookie（Path 限定到本路径）自动携带凭证，故此处只需原样透传。
    location /storage/uploads/images/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
