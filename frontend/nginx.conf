server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    # 使用 Docker 内置 DNS 动态解析上游服务名：nginx 配置中直接写服务名只会在启动时
    # 解析一次并缓存 IP，api 容器重建后 IP 变化会导致 502。用变量 + resolver 实现运行时解析。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 仅代理公开图片目录：其余 storage 子路径（导出/导入原始文档/预览）不再直通，改走鉴权接口
    location /storage/uploads/images/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}
