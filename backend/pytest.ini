[pytest]
asyncio_mode = auto
# 测试与 fixture 的事件循环作用域必须一致（均为 session）。
#
# 根因：asyncpg 的连接对象严格绑定创建它的 event loop，跨 loop 复用会抛
# "Event loop is closed" / "attached to a different loop" / "'NoneType' object
# has no attribute 'send'"。conftest 的 client/token/auth 均为 session 级 fixture，
# 其内部的引擎连接池建立在 session loop 上；若测试仍按默认的函数级 loop 运行，
# 每个测试都会在另一个 loop 里访问该池 → 连接层报错。
#
# 注意：SQLite/aiosqlite 通过独立线程执行，对 loop 归属不敏感，因此该问题在
# 迁移到 PostgreSQL（2026-09-21）前被长期掩盖。改动此项前请先阅读
# docs/LOCAL_DEV_SETUP.md 的「测试与事件循环」一节。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
